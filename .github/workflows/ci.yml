name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: python -m pip install --disable-pip-version-check poetry==2.2.1

      - name: Install deps
        run: poetry install --no-interaction --no-root

      - name: Check public snapshot hygiene
        run: poetry run python scripts/check_public_snapshot.py

      - name: Lint (ruff)
        run: poetry run ruff check .

      - name: Format check (black)
        run: poetry run black --check .

      - name: Tests
        run: poetry run pytest --maxfail=1 -q

      - name: Export Data Contract (JSON Schema)
        run: poetry run python -m scripts.export_schema

      - name: Upload schema artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: schema-artifacts
          path: schema/*.json
          if-no-files-found: error
          retention-days: 7

      # Optional: Docker Build (lokal, ohne Push)
      # - name: Build API image
      #   run: docker build -f deploy/docker/Dockerfile.app -t vulnp/api:ci .

      # - name: Build Worker image
      #   run: docker build -f deploy/docker/Dockerfile.worker -t vulnp/worker:ci .
