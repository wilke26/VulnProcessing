name: Generate httpx2 lockfile

on:
  push:
    branches: [ chore/httpx2-testclient ]

permissions:
  contents: read

jobs:
  lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check poetry==2.2.1
      - run: poetry lock
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: httpx2-poetry-lock
          path: poetry.lock
          if-no-files-found: error
          retention-days: 1
