# file: deploy/docker/docker-compose.dev.yml
version: "3.8"

services:
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  api:
    build:
      context: ../..    # Repo-Root
      dockerfile: deploy/docker/Dockerfile.app
    env_file:
      - ../../.env      # siehe .env.example
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=info
    ports:
      - "8000:8000"
    volumes:
      - ../..:/app      # Live-Reload während der Entwicklung
    command: >
      sh -c "uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    depends_on:
      - redis

  worker:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.worker
    env_file:
      - ../../.env
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=info
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    volumes:
      - ../..:/app
    command: >
      sh -c "celery -A app.tasks.celery_app.celery worker --loglevel=INFO"
    depends_on:
      - redis
